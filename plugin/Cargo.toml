[package]
name = "typst-zebra"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
ciborium = { version = "0.2", default-features = false }
datamatrix = "0.3"
qrcode = { version = "0.14", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
wasm-minimal-protocol = "0.1"

[profile.release]
lto = true
strip = true
opt-level = 'z'
codegen-units = 1
panic = 'abort'
